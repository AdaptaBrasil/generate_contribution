[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generate_contribution"
version = "0.1.0"
description = "Python port of ScriptRCalculoContribuicao: AdaptaBrasil indicator treatment, diagnostics and PPTX report generation."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "geopandas>=0.14",
    "shapely>=2.0",
    "python-pptx>=0.6.23",
    "graphviz>=0.20",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
generate-contribution = "generate_contribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
